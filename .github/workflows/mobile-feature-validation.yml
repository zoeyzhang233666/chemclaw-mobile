name: ChemClaw Mobile · search and expert-team validation
# PR #2 also requires the repository-wide pull_request CI before main merge.
# Final CI validates the regenerated 16 settings/search/landscape snapshots on main.

on:
  push:
    branches: [feat/mobile-search-chemical-expert-team]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search-runtime:
    name: Web search runtime and credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - run: python3 -m py_compile runtime/lib/rtbuild.py
      - run: node --check runtime/bridge/dsh-go-bridge/lib/web-search-auto.js
      - run: node --check runtime/bridge/dsh-go-bridge/lib/third-party-search.js
      - run: node --test runtime/tests/mobile-search-auto.test.mjs runtime/tests/third-party-search.test.mjs

  flutter-feature:
    name: Flutter static and chemical team
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DSH_TEST_FONT_DIR: /usr/share/fonts/opentype/noto
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: python3 tool/l10n_merge.py --check
      - name: Install CI fonts used by app test bootstrap
        working-directory: .
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq fonts-noto-cjk=1:20230817+repack1-3 fonts-noto-cjk-extra=1:20230817+repack1-3
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/emoji.ttf" https://raw.githubusercontent.com/googlefonts/noto-emoji/v2.051/fonts/NotoColorEmoji.ttf
          echo "72a635cb3d2f3524c51620cdde406b217204e8a6a06c6a096ff8ed4b5fd6e27b  $RUNNER_TEMP/emoji.ttf" | sha256sum -c -
          sudo install -Dm644 "$RUNNER_TEMP/emoji.ttf" /usr/share/fonts/noto/NotoColorEmoji.ttf
      - run: flutter test --no-pub test/agents/chem_team_bootstrap_test.dart
