# Temporary, narrowly scoped PR #2 snapshot refresh. Delete after commit.
name: PR2 one-time settings golden refresh
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/lib/ui/settings/index/spots.dart'
      - 'app/lib/ui/settings/settings_screen.dart'
      - '.github/workflows/pr2-refresh-settings-goldens.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.number == 2 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/mobile-search-chemical-expert-team'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DSH_TEST_FONT_DIR: /usr/share/fonts/opentype/noto
      TZ: Asia/Shanghai
    steps:
      - name: Checkout the exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Install the exact CI fonts
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq fonts-noto-cjk=1:20230817+repack1-3 fonts-noto-cjk-extra=1:20230817+repack1-3
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/emoji.ttf" https://raw.githubusercontent.com/googlefonts/noto-emoji/v2.051/fonts/NotoColorEmoji.ttf
          echo "72a635cb3d2f3524c51620cdde406b217204e8a6a06c6a096ff8ed4b5fd6e27b  $RUNNER_TEMP/emoji.ttf" | sha256sum -c -
          sudo install -Dm644 "$RUNNER_TEMP/emoji.ttf" /usr/share/fonts/noto/NotoColorEmoji.ttf
      - name: Resolve locked dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Verify that the expert-team entry is indexed
        working-directory: app
        run: flutter test --no-pub test/settings/index/index_sync_test.dart --plain-name '设置'
      - name: Regenerate only the three verified settings snapshots
        working-directory: app
        run: flutter test --no-pub --update-goldens test/settings/settings_pages_golden_test.dart --name '^settings_signed_in'
      - name: Commit snapshots to this PR branch only
        shell: bash
        run: |
          set -euo pipefail
          git add -- app/test/settings/goldens/en_settings_signed_in_light.png app/test/settings/goldens/settings_signed_in_dark.png app/test/settings/goldens/settings_signed_in_light.png
          git diff --cached --name-only
          count=$(git diff --cached --name-only | wc -l)
          if [ "$count" -ne 3 ]; then
            echo "::error::Expected exactly three reviewed snapshots, found $count"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(mobile): update three settings snapshots for expert team"
          expected="${{ github.event.pull_request.head.sha }}"
          current=$(git ls-remote origin refs/heads/feat/mobile-search-chemical-expert-team | cut -f1)
          if [ "$current" != "$expected" ]; then
            echo "::error::PR branch advanced; refusing stale push"
            exit 1
          fi
          git push origin HEAD:refs/heads/feat/mobile-search-chemical-expert-team
