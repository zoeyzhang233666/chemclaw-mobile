# One-time PR branch rebaseline: regenerated screenshots are actual rendered images,
# not disabled tests. The PR remains Draft for visual review.
name: ChemClaw Mobile · regenerate golden references

on:
  push:
    branches: [feat/chemclaw-mobile-brand-and-mcp]

permissions:
  contents: write

# Keep a single render job per feature branch; newer runs replace stale baselines.
concurrency:
  group: chemclaw-golden-${{ github.ref }}
  # Skipped branch pushes must not cancel an active baseline render.
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.repository == 'zoeyzhang233666/chemclaw-mobile' &&
      contains(github.event.head_commit.message, '[refresh-mobile-goldens]')
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      TZ: Asia/Shanghai
      DSH_TEST_FONT_DIR: /usr/share/fonts/opentype/noto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Install pinned CI fonts and Pillow
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq fonts-noto-cjk=1:20230817+repack1-3 fonts-noto-cjk-extra=1:20230817+repack1-3
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/emoji.ttf" https://raw.githubusercontent.com/googlefonts/noto-emoji/v2.051/fonts/NotoColorEmoji.ttf
          echo "72a635cb3d2f3524c51620cdde406b217204e8a6a06c6a096ff8ed4b5fd6e27b  $RUNNER_TEMP/emoji.ttf" | sha256sum -c -
          sudo install -Dm644 "$RUNNER_TEMP/emoji.ttf" /usr/share/fonts/noto/NotoColorEmoji.ttf
          python3 -m pip install --break-system-packages -q Pillow==13.0.0
      - name: Recreate 60 original ChemClaw cloud launcher rasters
        run: |
          python3 app/tool/render_chemclaw_launcher.py
          find app/android/app/src/main/res -name 'ic_launcher*.png' | wc -l
      - name: Install locked Dart packages
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Render refreshed UI golden images
        working-directory: app
        run: |
          # Non-golden functional tests can still fail. Record their exit code:
          # never report that the full test suite passed.
          set +e
          # Only files that actually assert screenshots: avoid executing hundreds of
          # unrelated functional/update tests during image regeneration. Main CI
          # still runs the complete suite separately, including security tests.
          mapfile -t golden_tests < <(grep -rlE 'matchesGoldenFile|goldenBoth\\(' test --include='*_test.dart' | sort)
          printf 'Golden test files: %s\\n' "${#golden_tests[@]}"
          test "${#golden_tests[@]}" -gt 0
          flutter test --no-pub --update-goldens --concurrency=4 --reporter compact "${golden_tests[@]}" > "$RUNNER_TEMP/rebaseline.log" 2>&1
          status=$?
          set -e
          echo "Flutter test exit status during rebaseline: $status" | tee "$RUNNER_TEMP/rebaseline-status.txt"
          tail -n 110 "$RUNNER_TEMP/rebaseline.log"
          test "$status" -eq 0 || echo 'Functional failures remain; check main CI. Golden files may still be generated.'
      - name: Stage only cloud icon PNGs and test golden PNGs
        run: |
          git add --all -- app/android/app/src/main/res/mipmap-mdpi app/android/app/src/main/res/mipmap-hdpi app/android/app/src/main/res/mipmap-xhdpi app/android/app/src/main/res/mipmap-xxhdpi app/android/app/src/main/res/mipmap-xxxhdpi
          git add --all -- ':(glob)app/test/**/goldens/*.png'
          git diff --cached --stat | tail -n 35
          git diff --cached --name-only | awk '{if ($0 !~ /^app\/(test\/.*\/goldens\/.*\.png|android\/app\/src\/main\/res\/mipmap-[a-z0-9]+\/ic_launcher.*\.png)$/) exit 1}'
          git diff --cached --quiet && echo 'No image changes to commit' || echo 'New baseline files staged'
      - name: Push image baselines to the independent mobile PR branch
        run: |
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test(mobile): update ChemClaw cloud icon and screenshot baselines'
          # A long golden render may outlive ordinary code commits. Never force-push
          # and never roll the mobile PR branch back: rebase the generated images
          # onto the latest head, then attempt a normal fast-forward push.
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo 'Cloud icons and golden baselines committed to mobile PR branch.'
              exit 0
            fi
          done
          echo 'Concurrent branch updates prevented the golden baseline push.' >&2
          exit 1
      - name: Upload non-golden diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-rebaseline-log
          path: |
            ${{ runner.temp }}/rebaseline.log
            ${{ runner.temp }}/rebaseline-status.txt
          if-no-files-found: ignore
          retention-days: 7
