# ADVANCED ONLY: example for a remote DSH Host WITHOUT ChemClaw bundled bridge.
# The Android LOCAL Host already has ChemClaw built-in MCP presets.
# Never duplicate the same MCP server in one Host and never commit a token.
- insert:
    - id: chemcloud-industry-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: streamable-http
        serverName: chem-data-hub
        url: https://datahub.chem-cloud.cn/mcp
        failOnStartupError: false
# The template does not auto-inject the HTTP Bearer token.
# Store the customer's CHEM_DATA_HUB key with the remote Host's own secrets
# system and bind Authorization securely in that Host. Do not paste it here.
